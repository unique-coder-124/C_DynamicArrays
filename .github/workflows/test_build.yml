name: build and run tests

on: [push]

jobs:
  build_builder:
    runs-on: ubuntu-latest
    steps:
      - name: build nob
        run: cc nob.c -o nob
  build_tests:
    runs-on: ubuntu-latest
    needs: build_builder
    steps:
      - name: build tests
        run: ./nob
  run_tests:
    runs-on: ubuntu-latest
    needs: build_tests
    steps:
      - name: run tests
        run: ./dist/release/main
